<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DropPanel</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        width: 320px;
        padding: 12px;
        margin: 0;
        color: #111;
      }
      .tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      button.tab {
        flex: 1;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
        background: #fff;
        cursor: pointer;
        font-weight: 700;
        font-size: 12px;
      }
      button.tab.active {
        background: #16a34a;
        border-color: #16a34a;
        color: #fff;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        margin-top: 10px;
      }
      select, input[type="number"] {
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
        font-size: 12px;
      }
      .section {
        display: none;
      }
      .section.active {
        display: block;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .row button {
        flex: 1;
        padding: 10px 0;
        border: none;
        border-radius: 8px;
        background: #16a34a;
        color: #fff;
        cursor: pointer;
        font-weight: 800;
        font-size: 12px;
      }
      #message {
        margin-top: 10px;
        font-size: 12px;
        color: #555;
        white-space: pre-wrap;
      }
      .error { color: #dc2626 !important; }
      .ok { color: #16a34a !important; }
    </style>
  </head>
  <body>
    <div class="tabs">
      <button id="tabPool" class="tab active" type="button">Pool</button>
      <button id="tabDirect" class="tab" type="button">Direct List</button>
    </div>

    <div id="poolTabContent" class="section active">
      <label for="storeSelect">Store</label>
      <select id="storeSelect"></select>

      <div class="row">
        <button id="btnCapturePool" type="button">Capture → Add to Pool</button>
      </div>
    </div>

    <div id="directTabContent" class="section">
      <label for="directStoreSelect">Store</label>
      <select id="directStoreSelect"></select>

      <label for="directQuantityInput">Quantity</label>
      <input id="directQuantityInput" type="number" min="1" max="999" value="1" />

      <div class="row">
        <button id="btnCaptureDirect" type="button">Capture → Direct List</button>
      </div>
    </div>

    <div id="message"></div>

    <script src="popup.js"></script>
  </body>
</html>
